<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Thrill & Chill Travel | Expert Travel Assistance</title>
  <meta name="description" content="Get in touch with Thrill & Chill Travel for personalized travel planning and support. We’re here to help make your dream vacation a reality." />
  <link rel="canonical" href="https://www.thrillandchilltravel.com/contact/" />

  <link rel="stylesheet" href="/css/main.css">

  <!-- Favicon links -->
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KEJWMQ9C68"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-KEJWMQ9C68');
  </script>


<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "url": "https://www.thrillandchilltravel.com/contact/",
    "mainEntity": {
      "@type": "Organization",
      "name": "Thrill & Chill Travel",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+1-843-806-6935",
        "contactType": "customer service",
        "areaServed": "US",
        "availableLanguage": "English"
      }
    }
  }
  </script>

</head>

<body>
  <header>
    <a href="/" class="logo">
      <img src="/images/logos/logo5.png" alt="Thrill & Chill Travel Logo" />
    </a>

    <nav class="nav-links">
      <a href="/">HOME</a>
      <a href="/free-quote/">FREE QUOTE</a>
      <a href="/about/">ABOUT US</a>
      <!-- <div class="dropdown">
            <div class="dropdown-btn">DESTINATIONS</div>
            <div class="dropdown-content">
              <a href="#">Disney</a>
              <a href="#">Universal</a>
              <a href="#">Cruises</a>
            </div>
          </div> -->
      <a href="/blog/">BLOG</a>
      <a href="/contact/">CONTACT</a>
    </nav>


    <button class="menu-toggle" aria-label="Toggle Menu">&#9776;</button>
  </header>
  <!-- Contact Page Content -->
  <div class="container">
    <!-- Right: Info Section -->
    <div class="info-section">
      <div style="max-width: 800px; margin: auto;">
        <h2>A Couple of Ways to Reach Us</h2>

        <p>📞 <strong>Call:</strong> <a href="tel:8438066935" class="no-blue-link">843-806-6935</a></p>
        <p>📧 <strong>Email:</strong> <a href="mailto:info@thrillandchill.com"
            class="no-blue-link">info@thrillandchill.com</a></p>
        <p>📋 Or just fill out the form to the right — and we'll handle the rest.</p>

        <h3>
          <strong>Your dream trip – powered by Thrill and Chill Travel.</strong>
        </h3>
      </div>

    </div>

    <!-- Left: Form Section -->
    <div class="form-section">
      <h2>Contact Us</h2>
      <form id="contact-form">
        <label for="name">Full Name *</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" />

        <label for="message">Tell us about your trip *</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Submit</button>
      </form>
    </div>
  </div>

  <section class="carousel-container">
    <div class="carousel-track" id="partner-carousel"></div>
  </section>

  <!-- Load EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <!-- Your separated email handling logic -->
  <script src="/environment/env.js" defer></script>
  <script src="/js/email.js" defer></script>

  <script src="/js/header.js"></script>
  <script src="/js/footer.js"></script>
  <script src="/js/carousel.js" defer></script>
</body>

</html>
